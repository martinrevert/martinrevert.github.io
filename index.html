<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web OTP Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; line-height: 1.4; }
      input { font-size: 20px; padding: 10px 12px; width: 12ch; }
      pre { white-space: pre-wrap; word-break: break-word; padding: 12px; border: 1px solid rgba(127,127,127,.35); border-radius: 8px; }
      .muted { opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>Web OTP Demo</h1>

    <p class="muted" id="version"></p>

    <p class="muted">
      This page listens for an incoming SMS containing an origin-bound OTP.
      It does <strong>not</strong> send an SMS.
    </p>

    <div>
      <label for="otp">Code</label><br />
      <input
        id="otp"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
      />
    </div>

    <h2>SMS format required</h2>
    <p class="muted">Send an SMS to this Android device using exactly this format (replace <code>123456</code> with your 6-digit code):</p>
    <pre id="smsTemplate"></pre>

    <h2>Diagnostics</h2>
    <p class="muted" id="status">Status: idle</p>
    <pre id="log"></pre>

    <script>
      const logEl = document.getElementById('log');
      const otpInput = document.getElementById('otp');
      const smsTemplateEl = document.getElementById('smsTemplate');
      const statusEl = document.getElementById('status');
      const versionEl = document.getElementById('version');

      const VERSION = '2026-02-05.1';
      versionEl.textContent = `Version: ${VERSION}`;

      const log = (msg) => {
        const line = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
        logEl.textContent += (logEl.textContent ? '\n' : '') + line;
        console.log(msg);
      };

      const setStatus = (s) => {
        statusEl.textContent = `Status: ${s}`;
      };

      window.addEventListener('error', (e) => {
        log(`Window error: ${e?.message || 'unknown'} at ${e?.filename || ''}:${e?.lineno || ''}`);
      });
      window.addEventListener('unhandledrejection', (e) => {
        const reason = e?.reason;
        log(`Unhandled rejection: ${reason?.name || ''} ${reason?.message || String(reason)}`);
      });
      document.addEventListener('visibilitychange', () => {
        log(`visibility: ${document.visibilityState}`);
      });

      otpInput.addEventListener('input', () => {
        log(`input event: value=${JSON.stringify(otpInput.value)}`);
      });

      // For the SMS origin binding, use hostname (no port).
      const smsDomain = location.hostname;

      // Web OTP requires an origin-bound SMS.
      // The "@host #code" line must match the current page's host.
      smsTemplateEl.textContent =
        `<#> Your verification code is 123456\n@${smsDomain} #123456`;

      log(`domain for SMS: ${smsDomain}`);
      log(`full host (includes port): ${location.host}`);
      log(`href: ${location.href}`);
      log(`secure context: ${window.isSecureContext}`);
      log(`OTPCredential in window: ${'OTPCredential' in window}`);
      log(`userAgent: ${navigator.userAgent}`);
      log(`userActivation supported: ${'userActivation' in navigator}`);
      if ('userActivation' in navigator) {
        log(`userActivation.isActive: ${navigator.userActivation.isActive}`);
        log(`userActivation.hasBeenActive: ${navigator.userActivation.hasBeenActive}`);
      }

      const LISTEN_TIMEOUT_MS = 5 * 60 * 1000;
      let lastErrorName = null;
      let attemptSeq = 0;
      /** @type {AbortController | null} */
      let activeAbortController = null;
      /** @type {number | null} */
      let heartbeatId = null;
      /** @type {number | null} */
      let listeningStartedAt = null;

      const stopHeartbeat = () => {
        if (heartbeatId != null) {
          clearInterval(heartbeatId);
          heartbeatId = null;
        }
      };

      const startHeartbeat = (attemptId) => {
        stopHeartbeat();
        heartbeatId = setInterval(() => {
          if (listeningStartedAt == null) return;
          const elapsedSec = Math.round((Date.now() - listeningStartedAt) / 1000);
          setStatus(`listening (${elapsedSec}s) [attempt ${attemptId}]`);
        }, 1000);
      };

      const startListening = async (trigger, { forceRestart = false } = {}) => {
        // If something is already listening, allow a gesture-triggered restart.
        if (activeAbortController && forceRestart) {
          try {
            activeAbortController.abort('Restarting listener (user activation)');
          } catch {
            // ignore
          }
        } else if (activeAbortController) {
          log(`startListening ignored (already listening), trigger=${trigger}`);
          return;
        }

        const attemptId = ++attemptSeq;

        setStatus('starting');
        log(`startListening(trigger=${trigger}, attempt=${attemptId}) @ ${new Date().toISOString()}`);
        otpInput.focus();

        if (!window.isSecureContext) {
          log('Web OTP requires HTTPS (or localhost).');
          setStatus('blocked: insecure context');
          return;
        }

        if (!('OTPCredential' in window)) {
          log('Web OTP API not available in this browser/context.');
          setStatus('blocked: Web OTP unavailable');
          return;
        }

        const ac = new AbortController();
        activeAbortController = ac;
        listeningStartedAt = Date.now();
        startHeartbeat(attemptId);
        ac.signal.addEventListener('abort', () => {
          log(`AbortSignal aborted: ${String(ac.signal.reason || '(no reason)')}`);
        });

        const timeoutId = setTimeout(() => {
          ac.abort('Timed out waiting for SMS');
        }, LISTEN_TIMEOUT_MS);

        log(`Listening for SMS OTP for up to ${Math.round(LISTEN_TIMEOUT_MS / 1000)}s…`);
        setStatus('listening');
        try {
          const otp = await navigator.credentials.get({
            otp: { transport: ['sms'] },
            signal: ac.signal,
          });

          log('navigator.credentials.get() resolved.');
          setStatus('resolved');
          try {
            log(`credential type: ${otp?.type ?? '(none)'}`);
            log(`credential keys: ${otp ? Object.keys(otp).join(', ') : '(none)'}`);
            log(`raw otp.code: ${typeof otp?.code === 'string' ? JSON.stringify(otp.code) : String(otp?.code)}`);
          } catch {
            // ignore logging failures
          }

          if (otp && typeof otp.code === 'string') {
            const raw = otp.code;
            const digitsOnly = raw.replace(/\D+/g, '');
            const code = (digitsOnly.match(/\d{6}/)?.[0] ?? digitsOnly.slice(0, 6) ?? raw).trim().slice(0, 6);

            // Some UIs/frameworks only react when input events fire.
            // Also delay to the next tick in case Chrome applies changes after the permission sheet.
            await new Promise((r) => setTimeout(r, 0));
            otpInput.value = code;
            otpInput.dispatchEvent(new Event('input', { bubbles: true }));
            otpInput.dispatchEvent(new Event('change', { bubbles: true }));
            otpInput.focus();

            log(`Filled code: ${JSON.stringify(code)} (len=${code.length})`);
            setStatus('filled');
          } else {
            log('Received an OTP credential, but no string code was present.');
            setStatus('resolved: no code');
          }
        } catch (err) {
          log(`Error: ${err?.name || 'UnknownError'}: ${err?.message || String(err)}`);
          setStatus(`error: ${err?.name || 'UnknownError'}`);
          lastErrorName = err?.name || 'UnknownError';
        } finally {
          clearTimeout(timeoutId);
          stopHeartbeat();
          activeAbortController = null;
          listeningStartedAt = null;
        }

        // If we errored immediately due to a gesture requirement, allow a retry.
        // Some Chrome contexts require a user activation before OTP retrieval.
        if (lastErrorName === 'NotAllowedError' || lastErrorName === 'SecurityError') {
          log('Will retry on first user interaction (tap/click) if needed.');
          setStatus('waiting for user interaction to retry');
        }
      };

      // Attempt immediately on load (may be blocked in some contexts).
      window.addEventListener('load', () => {
        startListening('load');
      });

      // One-time retry on the first user activation if the load attempt was blocked.
      document.addEventListener(
        'click',
        () => {
          // If Chrome requires activation, restart under a real gesture.
          startListening('user-click', { forceRestart: true });
        },
        { once: true }
      );
      document.addEventListener(
        'touchend',
        () => {
          startListening('user-touch', { forceRestart: true });
        },
        { once: true }
      );
    </script>
  </body>
</html>
